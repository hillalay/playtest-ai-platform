[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playtest-ai"
version = "0.1.0"
description = "Game-agnostic automated playtesting platform"
requires-python = ">=3.13"

dependencies = [
    "pydantic",
    "pyyaml",
    "jsonschema",
    "typer",
    "rich"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
playtest = "playtest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]