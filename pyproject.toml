[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playtest-ai"
version = "0.1.0"
description = "Game-agnostic automated playtesting platform"
requires-python = ">=3.10,<3.11"

dependencies = [
    "pydantic",
    "pyyaml",
    "jsonschema",
    "typer",
    "rich",
    "numpy>=1.23.5,<1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
playtest = "playtest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"playtest.definition" = ["*.schema.json"]
